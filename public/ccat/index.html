<meta charset="utf-8">
<title>CCAT Practice — Timed Aptitude Drill</title>
<style>
  :root{
    --bg:#ECEEEC; --bg-raised:#FFFFFF; --bg-sunken:#E0E3E1;
    --text:#14171C; --text-soft:#4B5259; --text-faint:#7A8087;
    --accent:#3556D9; --accent-contrast:#FFFFFF; --accent-soft:rgba(53,86,217,0.10);
    --rule:rgba(20,23,28,0.14); --rule-strong:rgba(20,23,28,0.28);
    --success:#2E8B57; --success-bg:rgba(46,139,87,0.12);
    --danger:#C1443A; --danger-bg:rgba(193,68,58,0.12);
    --warning:#C98A2C; --warning-bg:rgba(201,138,44,0.16);
    --shadow: 0 1px 2px rgba(20,23,28,0.06), 0 8px 24px -12px rgba(20,23,28,0.18);
    --font-display: 800 1rem/1.1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-body: 400 1rem/1.6 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: 600 1rem/1 ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171C; --bg-raised:#1D2128; --bg-sunken:#0F1216;
      --text:#ECEEEC; --text-soft:#9AA0A6; --text-faint:#6B7178;
      --accent:#5B7FFF; --accent-contrast:#0B1020; --accent-soft:rgba(91,127,255,0.16);
      --rule:rgba(236,238,236,0.14); --rule-strong:rgba(236,238,236,0.26);
      --success:#4CAF7D; --success-bg:rgba(76,175,125,0.14);
      --danger:#E06A5C; --danger-bg:rgba(224,106,92,0.14);
      --warning:#E0A94E; --warning-bg:rgba(224,169,78,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171C; --bg-raised:#1D2128; --bg-sunken:#0F1216;
    --text:#ECEEEC; --text-soft:#9AA0A6; --text-faint:#6B7178;
    --accent:#5B7FFF; --accent-contrast:#0B1020; --accent-soft:rgba(91,127,255,0.16);
    --rule:rgba(236,238,236,0.14); --rule-strong:rgba(236,238,236,0.26);
    --success:#4CAF7D; --success-bg:rgba(76,175,125,0.14);
    --danger:#E06A5C; --danger-bg:rgba(224,106,92,0.14);
    --warning:#E0A94E; --warning-bg:rgba(224,169,78,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
  }
  :root[data-theme="light"]{
    --bg:#ECEEEC; --bg-raised:#FFFFFF; --bg-sunken:#E0E3E1;
    --text:#14171C; --text-soft:#4B5259; --text-faint:#7A8087;
    --accent:#3556D9; --accent-contrast:#FFFFFF; --accent-soft:rgba(53,86,217,0.10);
    --rule:rgba(20,23,28,0.14); --rule-strong:rgba(20,23,28,0.28);
    --success:#2E8B57; --success-bg:rgba(46,139,87,0.12);
    --danger:#C1443A; --danger-bg:rgba(193,68,58,0.12);
    --warning:#C98A2C; --warning-bg:rgba(201,138,44,0.16);
    --shadow: 0 1px 2px rgba(20,23,28,0.06), 0 8px 24px -12px rgba(20,23,28,0.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font:var(--font-body);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,h3{font:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-0.02em;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer; color:inherit;}

  /* ---- LBT immersive shell ---- */
  .lbt-shell{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 clamp(16px,4vw,40px); height:52px;
    background:var(--bg); border-bottom:1px solid var(--rule);
  }
  .lbt-logo-wrap{ display:flex; align-items:center; text-decoration:none; }
  .lbt-logo-img{ height:28px; width:auto; display:block; }
  @media(prefers-color-scheme:dark){ .lbt-logo-img{ filter:brightness(0) invert(1); } }
  :root[data-theme="dark"] .lbt-logo-img{ filter:brightness(0) invert(1); }
  :root[data-theme="light"] .lbt-logo-img{ filter:none; }
  .lbt-back{
    font-size:.8rem; font-weight:700; letter-spacing:.04em;
    color:var(--text-soft); text-decoration:none;
    display:flex; align-items:center; gap:4px; border:none; background:none; cursor:pointer;
    padding:0; font-family:inherit;
  }
  .lbt-back:hover{ color:var(--text); }
  /* shift the test runner's own topbar so it sits below the shell */
  .topbar{ top:52px; }

  /* ---- Question navigator grid ---- */
  .qnav{
    margin-top:1.5rem; padding:1.25rem; background:var(--bg-raised);
    border:1px solid var(--rule); border-radius:8px;
  }
  .qnav-label{
    font:700 0.7rem/1 sans-serif; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--text-faint); margin-bottom:0.75rem; display:flex; justify-content:space-between; align-items:center;
  }
  .qnav-legend{ display:flex; gap:1rem; }
  .qnav-legend span{ display:flex; align-items:center; gap:0.3rem; font-size:0.68rem; font-weight:600; color:var(--text-faint); }
  .qnav-grid{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .qbox{
    width:32px; height:32px; border-radius:4px; border:1.5px solid var(--rule-strong);
    background:var(--bg); color:var(--text-soft);
    font:var(--font-mono); font-size:0.7rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:border-color .1s, background .1s;
    padding:0;
  }
  .qbox:hover{ border-color:var(--accent); color:var(--accent); }
  .qbox.current{ border-color:var(--accent); background:var(--accent); color:var(--accent-contrast); }
  .qbox.answered{ background:var(--success); border-color:var(--success); color:#fff; }
  .qbox.answered.current{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px;}
  .mono{font:var(--font-mono); font-variant-numeric:tabular-nums;}
  .eyebrow{
    font:700 0.7rem/1 -apple-system, sans-serif; text-transform:uppercase;
    letter-spacing:0.12em; color:var(--text-faint);
  }
  .screen{max-width:920px; margin:0 auto; padding:2.5rem 1.5rem 5rem;}
  .hidden{display:none !important;}

  /* ---- Home ---- */
  .home-head{margin-bottom:2.25rem;}
  .home-head h1{font-size:clamp(2rem,4.4vw,2.9rem); margin-top:0.5rem;}
  .home-head p{color:var(--text-soft); margin-top:0.75rem; max-width:56ch; line-height:1.6;}
  .form-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:1rem; margin-top:2rem;
  }
  .form-card{
    background:var(--bg-raised); border:1px solid var(--rule); border-radius:6px;
    padding:1.4rem; text-align:left; display:flex; flex-direction:column; gap:0.9rem;
    box-shadow:var(--shadow); position:relative; transition:transform .12s ease, border-color .12s ease;
    min-height:180px;
  }
  .form-card:hover{border-color:var(--rule-strong); transform:translateY(-2px);}
  .form-tag{
    position:absolute; top:1rem; right:1.1rem; font:var(--font-mono); font-size:0.68rem;
    color:var(--text-faint); border:1px solid var(--rule); border-radius:3px; padding:0.15rem 0.4rem;
  }
  .form-card h3{font-size:1.15rem;}
  .form-card .desc{color:var(--text-soft); font-size:0.9rem; line-height:1.55; flex:1;}
  .form-meta{display:flex; gap:1rem; font:var(--font-mono); font-size:0.78rem; color:var(--text-faint);}
  .form-meta b{color:var(--text); font-weight:700;}
  .btn{
    border:1px solid var(--rule-strong); background:var(--bg-raised); color:var(--text);
    border-radius:5px; padding:0.6rem 1rem; font-weight:700; font-size:0.85rem;
    display:inline-flex; align-items:center; justify-content:center; gap:0.4rem;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
  .btn-primary:hover{filter:brightness(1.08); color:var(--accent-contrast);}
  .btn-block{width:100%;}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{border-color:var(--rule);}

  .cat-row{display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.9rem;}
  .chip{
    border:1px solid var(--rule-strong); border-radius:20px; padding:0.4rem 0.85rem;
    font-size:0.82rem; font-weight:600; color:var(--text-soft); background:var(--bg-raised);
    cursor:pointer; user-select:none;
  }
  .chip:hover{ border-color:var(--accent); color:var(--accent); }
  .chip.active{border-color:var(--accent); color:var(--accent-contrast); background:var(--accent);}

  /* ---- Setup panel (practice config) ---- */
  .panel{
    background:var(--bg-raised); border:1px solid var(--rule); border-radius:6px;
    padding:1.5rem; box-shadow:var(--shadow); margin-top:1.5rem;
  }
  .panel-row{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0.85rem 0; border-bottom:1px solid var(--rule);}
  .panel-row:last-of-type{border-bottom:none;}
  .panel-row .label{font-weight:700; font-size:0.92rem;}
  .panel-row .sub{color:var(--text-faint); font-size:0.78rem; margin-top:0.15rem;}

  /* ---- Test runner ---- */
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--rule);
    padding:0.9rem 1.5rem;
  }
  .topbar-inner{max-width:920px; margin:0 auto; display:flex; align-items:center; gap:1.25rem;}
  .timer{
    font:var(--font-mono); font-size:1.6rem; font-weight:700; min-width:5ch; text-align:center;
    padding:0.25rem 0.6rem; border-radius:4px; border:1px solid var(--rule);
  }
  .timer.warn{color:var(--warning); border-color:var(--warning); background:var(--warning-bg);}
  .timer.critical{color:var(--danger); border-color:var(--danger); background:var(--danger-bg); animation:pulse 1s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){ .timer.critical{animation:none;} }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
  .qcount{font:var(--font-mono); font-size:0.85rem; color:var(--text-soft); white-space:nowrap;}
  .progress-track{flex:1; height:6px; background:var(--bg-sunken); border-radius:3px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:3px; transition:width .25s ease;}
  .cat-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:0.4rem;}
  .cat-Math .cat-dot{background:#3556D9;} .cat-Verbal .cat-dot{background:#2E8B57;} .cat-Spatial .cat-dot{background:#C98A2C;}

  .qcard{
    background:var(--bg-raised); border:1px solid var(--rule); border-radius:8px;
    padding:2rem; margin-top:2rem; box-shadow:var(--shadow);
  }
  .qcat-label{display:flex; align-items:center; font:700 0.72rem/1 sans-serif; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-faint); margin-bottom:1rem;}
  .qprompt{font-size:1.2rem; font-weight:600; line-height:1.5; margin-bottom:1.5rem;}
  .qvisual{display:flex; justify-content:center; gap:1.5rem; margin:1rem 0 1.75rem; flex-wrap:wrap;}
  .qvisual svg{width:76px; height:76px;}

  .options{display:flex; flex-direction:column; gap:0.6rem;}
  .option{
    display:flex; align-items:center; gap:0.9rem; padding:0.75rem 1rem;
    border:1px solid var(--rule); border-radius:6px; background:var(--bg);
    text-align:left; width:100%; transition:border-color .1s ease, background .1s ease;
  }
  .option:hover{border-color:var(--accent);}
  .option .bubble{
    flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1.5px solid var(--rule-strong);
    display:flex; align-items:center; justify-content:center; font:var(--font-mono); font-weight:700; font-size:0.85rem;
    color:var(--text-soft);
  }
  .option .otext{font-size:0.98rem;}
  .option.selected .bubble{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
  .option.selected{border-color:var(--accent); background:var(--accent-soft);}
  .option.correct{border-color:var(--success); background:var(--success-bg);}
  .option.correct .bubble{background:var(--success); border-color:var(--success); color:#fff;}
  .option.incorrect{border-color:var(--danger); background:var(--danger-bg);}
  .option.incorrect .bubble{background:var(--danger); border-color:var(--danger); color:#fff;}
  .option.disabled{cursor:default;}

  .options.visual{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:0.75rem;}
  .options.visual .option{flex-direction:column; padding:0.9rem 0.5rem 0.7rem; gap:0.4rem;}
  .options.visual .bubble{width:24px;height:24px;font-size:0.7rem;}
  .options.visual svg{width:56px;height:56px;}

  .explain{
    margin-top:1.25rem; padding:0.9rem 1rem; border-radius:6px; background:var(--bg-sunken);
    font-size:0.88rem; color:var(--text-soft); line-height:1.55; display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .qfooter{display:flex; justify-content:space-between; align-items:center; margin-top:1.75rem;}

  /* ---- Results ---- */
  .score-hero{
    display:flex; align-items:baseline; gap:1rem; background:var(--bg-raised); border:1px solid var(--rule);
    border-radius:8px; padding:2rem; box-shadow:var(--shadow); margin-top:1.5rem; flex-wrap:wrap;
  }
  .score-big{font:var(--font-mono); font-size:3.4rem; font-weight:700;}
  .score-sub{color:var(--text-soft); font-size:0.95rem;}
  .stat-strip{display:flex; gap:2rem; margin-left:auto; flex-wrap:wrap;}
  .stat{display:flex; flex-direction:column; gap:0.2rem;}
  .stat .n{font:var(--font-mono); font-size:1.3rem; font-weight:700;}
  .stat .l{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint);}

  .cat-breakdown{margin-top:1.5rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0.9rem;}
  .cat-card{background:var(--bg-raised); border:1px solid var(--rule); border-radius:6px; padding:1rem 1.2rem;}
  .cat-card .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; font-weight:700; font-size:0.9rem;}
  .cat-bar{height:6px; border-radius:3px; background:var(--bg-sunken); overflow:hidden;}
  .cat-bar > div{height:100%;}

  .review-list{margin-top:2rem; display:flex; flex-direction:column; gap:0.75rem;}
  .review-item{background:var(--bg-raised); border:1px solid var(--rule); border-radius:6px; padding:1rem 1.2rem;}
  .review-item .rq{font-weight:600; margin-bottom:0.4rem;}
  .review-item .ra{font-size:0.85rem; color:var(--text-soft); display:flex; gap:1.2rem; flex-wrap:wrap; margin-bottom:0.35rem;}
  .review-item .ra .wrong{color:var(--danger);}
  .review-item .ra .right{color:var(--success);}
  .review-item .rex{font-size:0.85rem; color:var(--text-faint); line-height:1.5;}

  /* ---- History ---- */
  .hist-chart{background:var(--bg-raised); border:1px solid var(--rule); border-radius:6px; padding:1.2rem; margin-top:1.5rem;}
  table{width:100%; border-collapse:collapse; margin-top:1.5rem; font-size:0.88rem;}
  th{text-align:left; font:700 0.7rem/1 sans-serif; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); padding:0.5rem 0.6rem; border-bottom:1px solid var(--rule-strong);}
  td{padding:0.6rem; border-bottom:1px solid var(--rule);}
  .table-wrap{overflow-x:auto;}
  .empty{color:var(--text-faint); padding:2rem 0; text-align:center; font-size:0.9rem;}

  .topnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:0.5rem;}
  .topnav .back{font-size:0.85rem;}
</style>

<div class="lbt-shell">
  <a href="/" class="lbt-logo-wrap">
    <img src="/lbt-logo.png" alt="LBT" class="lbt-logo-img" />
  </a>
  <a href="/tools" class="lbt-back" id="lbt-back-btn">← Back to Toolkit</a>
</div>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============================= UTIL ============================= */
  const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtTime(sec){ sec=Math.max(0,Math.ceil(sec)); const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

  /* ============================= WORD BANKS ============================= */
  const SYN = [
    ["candid","frank"],["ample","plentiful"],["brisk","quick"],["diligent","hardworking"],
    ["elated","joyful"],["frugal","thrifty"],["genuine","authentic"],["hostile","antagonistic"],

    ["diligent","lazy"],["expand","contract"],["frugal","wasteful"],["genuine","fake"],
    ["harmony","discord"],["humble","arrogant"],["increase","diminish"],["lucid","confusing"],
    ["mandatory","optional"],["novice","expert"],["obsolete","current"],["permanent","temporary"],
    ["reluctant","eager"],["rigid","flexible"],["sparse","dense"],["timid","bold"],
    ["transparent","opaque"],["unify","divide"],["vague","precise"],["volatile","stable"],
    ["ample","insufficient"],["brisk","sluggish"],["coarse","refined"],["deplete","replenish"]
  ];
  const ANALOGY = [
    ["hammer","carpenter","scalpel","surgeon"],
    ["puppy","dog","kitten","cat"],
    ["author","book","composer","symphony"],
    ["fin","fish","wing","bird"],
    ["thermometer","temperature","scale","weight"],

    ["drought","water","famine","food"],
    ["actor","script","musician","sheet music"],
    ["nurse","hospital","farmer","farm"]
  ];
  const LOGIC_TEMPLATES = [
    {p:["All engineers at the firm are certified.","Maria works at the firm as an engineer."],
     q:"Which conclusion follows?", opts:["Maria is certified.","Maria is not certified.","Maria manages the firm.","Cannot be determined."], a:0,
     ex:"Since all engineers at the firm are certified and Maria is one of them, Maria must be certified."},
    {p:["No interns are given building access.","Sam has building access."],
     q:"Which conclusion follows?", opts:["Sam is an intern.","Sam is not an intern.","Sam is a manager.","Cannot be determined."], a:1,
     ex:"If no interns have access and Sam has access, Sam cannot be an intern."},
    {p:["Every product that ships internationally is insured.","This product is not insured."],
     q:"Which conclusion follows?", opts:["It ships internationally.","It does not ship internationally.","It is defective.","Cannot be determined."], a:1,
     ex:"Insurance is required for international shipping; since it's not insured, it can't be shipping internationally."},
    {p:["If the server load exceeds 80%, an alert fires.","No alert fired today."],
     q:"Which conclusion follows?", opts:["Load exceeded 80%.","Load did not exceed 80%.","The server is offline.","Cannot be determined."], a:1,
     ex:"The alert is a direct consequence of exceeding 80% load; no alert means load stayed at or below 80%."},
    {p:["All members who pay dues may vote.","Jordan may vote."],
     q:"Which conclusion follows?", opts:["Jordan paid dues.","Jordan did not pay dues.","Jordan is an officer.","Cannot be determined."], a:3,
     ex:"Paying dues guarantees voting rights, but voting rights could exist for other reasons too — this doesn't confirm Jordan paid dues."},
    {p:["Some analysts on the team know Python.","Priya is an analyst on the team."],
     q:"Which conclusion follows?", opts:["Priya knows Python.","Priya does not know Python.","Priya is the team lead.","Cannot be determined."], a:3,
     ex:"\"Some\" analysts know Python doesn't mean all do, so Priya's status can't be determined."},
    {p:["Every certified welder passed the safety exam.","Deshawn passed the safety exam."],

     ex:"Passing the exam is required for certification but doesn't by itself prove certification — other requirements may exist."},
    {p:["If a shipment is late, the client is notified automatically.","The client was not notified."],
     q:"Which conclusion follows?", opts:["The shipment was late.","The shipment was not late.","The client canceled.","Cannot be determined."], a:1,
     ex:"Lateness always triggers notification; no notification means the shipment was not late."}
  ];

  /* ============================= MATH GENERATORS ============================= */
  function numOptions(correct, spread){
    const set = new Set([correct]);
    while(set.size<4){ set.add(correct + pick([-1,1])*rnd(1,spread)); }
    return shuffle([...set]).map(String);
  }
  function mkChoice(opts, correctVal){
    const strs = opts.map(String);
    return { choices: strs, correctIndex: strs.indexOf(String(correctVal)) };
  }

  function genPercent(){
    const type = rnd(1,3);
    if(type===1){
      const base = rnd(4,40)*5, pct = pick([10,15,20,25,30,40,50,60,75]);
      const ans = Math.round(base*pct/100);
      const {choices, correctIndex} = mkChoice(numOptions(ans, Math.max(3,Math.round(ans*0.2))), ans);
      return {category:"Math", prompt:`What is ${pct}% of ${base}?`, choices, correctIndex,
        explanation:`${pct}% of ${base} = ${pct}/100 × ${base} = <b>${ans}</b>.`};
    } else if(type===2){
      const whole = rnd(20,200), part = rnd(1,whole-1);
      const ans = Math.round(part/whole*100);
      const {choices, correctIndex} = mkChoice(numOptions(ans,8).map(v=>v+"%"), ans+"%");
      return {category:"Math", prompt:`${part} is what percent of ${whole}? (nearest whole percent)`, choices, correctIndex,
        explanation:`${part} / ${whole} × 100 ≈ <b>${ans}%</b>.`};
    } else {
      const base = rnd(40,300), pct = pick([10,20,25,50]);
      const up = pick([true,false]);
      const ans = up ? Math.round(base*(1+pct/100)) : Math.round(base*(1-pct/100));
      const {choices, correctIndex} = mkChoice(numOptions(ans, Math.max(3,Math.round(base*0.08))), ans);
      return {category:"Math", prompt:`A value of ${base} is ${up?"increased":"decreased"} by ${pct}%. What is the new value?`,
        choices, correctIndex, explanation:`${base} ${up?"+ ":"− "}(${pct}% × ${base}) = <b>${ans}</b>.`};
    }
  }

  function genRatio(){
    const a=rnd(2,9), b=rnd(2,9);
    if(a===b) return genRatio();
    const scale = rnd(2,6);
    const total = (a+b)*scale;
    const askA = pick([true,false]);
    const ans = askA ? a*scale : b*scale;
    const {choices, correctIndex} = mkChoice(numOptions(ans, Math.max(2,scale)), ans);
    return {category:"Math", prompt:`A mix of sand and gravel is in the ratio ${a}:${b}. If there are ${total} total units, how many units of ${askA?"sand":"gravel"} are there?`,
      choices, correctIndex,
      explanation:`Total parts = ${a}+${b} = ${a+b}. Each part = ${total}/${a+b} = ${scale}. ${askA?"Sand":"Gravel"} = ${askA?a:b} × ${scale} = <b>${ans}</b>.`};
  }

  function genSeries(){
    const type = pick(["arith","geo","fib","square","alt"]);
    let seq=[], next, ex;
    if(type==="arith"){
      const start=rnd(2,20), d=pick([2,3,4,5,-2,-3,6]);
      seq=[0,1,2,3].map(i=>start+i*d); next = start+4*d;
      ex = `Each term increases by ${d}.`;
    } else if(type==="geo"){
      const start=rnd(1,5), r=pick([2,3]);
      seq=[0,1,2,3].map(i=>start*Math.pow(r,i)); next = start*Math.pow(r,4);
      ex = `Each term is multiplied by ${r}.`;
    } else if(type==="fib"){
      let a=rnd(1,5), b=rnd(a+1,a+6);
      seq=[a,b]; for(let i=0;i<2;i++) seq.push(seq[seq.length-1]+seq[seq.length-2]);
      next = seq[seq.length-1]+seq[seq.length-2];
      ex = `Each term is the sum of the two before it.`;
    } else if(type==="square"){
      const start=rnd(1,4);
      seq=[0,1,2,3].map(i=>Math.pow(start+i,2)); next = Math.pow(start+4,2);
      ex = `These are consecutive perfect squares.`;
    } else {
      const start=rnd(2,15), d1=pick([2,3,4]), d2=pick([5,6,7]);
      seq=[start, start+d1, start+d1+d2, start+2*d1+d2]; next = start+2*d1+2*d2;
      ex = `The differences alternate between +${d1} and +${d2}.`;
    }
    const spread = Math.max(2, Math.round(Math.abs(next)*0.15)+2);
    const {choices, correctIndex} = mkChoice(numOptions(next, spread), next);
    return {category:"Math", prompt:`What number comes next in the series? ${seq.join(", ")}, ?`, choices, correctIndex,
      explanation:`${ex} Next term = <b>${next}</b>.`};
  }

  function genRate(){
    const type=rnd(1,2);
    if(type===1){
      const speed=rnd(30,70), time=rnd(2,6);
      const ans = speed*time;
      const {choices, correctIndex} = mkChoice(numOptions(ans, 20), ans);
      return {category:"Math", prompt:`A train travels at ${speed} mph for ${time} hours. How far does it travel?`,
        choices, correctIndex, explanation:`distance = speed × time = ${speed} × ${time} = <b>${ans}</b> miles.`};
    } else {
      const rate=rnd(3,12), workers=rnd(2,6);
      const hours=rnd(2,8);
      const ans = rate*workers*hours;
      const {choices, correctIndex} = mkChoice(numOptions(ans, Math.max(4,Math.round(ans*0.15))), ans);
      return {category:"Math", prompt:`Each worker assembles ${rate} units per hour. How many units do ${workers} workers assemble in ${hours} hours?`,
        choices, correctIndex, explanation:`${rate} × ${workers} × ${hours} = <b>${ans}</b> units.`};
    }
  }

  function genAlgebra(){
    const x = rnd(2,15), a=rnd(2,9), b=rnd(1,30);
    const c = a*x+b;
    const {choices, correctIndex} = mkChoice(numOptions(x, 3), x);
    return {category:"Math", prompt:`Solve for x: ${a}x + ${b} = ${c}`, choices, correctIndex,
      explanation:`${a}x = ${c} − ${b} = ${c-b}, so x = ${c-b} / ${a} = <b>${x}</b>.`};
  }

  const MATH_GENS = [genPercent, genRatio, genSeries, genRate, genAlgebra];

  /* ============================= VERBAL GENERATORS ============================= */
  function genSynonym(){
    const [w, correct] = pick(SYN);
    let pool = shuffle(SYN.filter(p=>p[1]!==correct)).slice(0,3).map(p=>p[1]);
    const choices = shuffle([correct, ...pool]);
    return {category:"Verbal", prompt:`Choose the word that means most nearly the same as “${w}.”`,
      choices, correctIndex: choices.indexOf(correct),
      explanation:`“${esc(w)}” most nearly means <b>${esc(correct)}</b>.`};
  }
  function genAntonym(){
    const [w, correct] = pick(ANT);
    let pool = shuffle(ANT.filter(p=>p[1]!==correct)).slice(0,3).map(p=>p[1]);
    const choices = shuffle([correct, ...pool]);
    return {category:"Verbal", prompt:`Choose the word most nearly OPPOSITE to “${w}.”`,
      choices, correctIndex: choices.indexOf(correct),
      explanation:`The opposite of “${esc(w)}” is <b>${esc(correct)}</b>.`};
  }
  function genAnalogy(){
    const [a,b,c,d] = pick(ANALOGY);
    const others = shuffle(ANALOGY.filter(t=>t[3]!==d)).slice(0,3).map(t=>t[3]);
    const choices = shuffle([d, ...others]);
    return {category:"Verbal", prompt:`${a.toUpperCase()} is to ${b.toUpperCase()} as ${c.toUpperCase()} is to ___?`,
      choices, correctIndex: choices.indexOf(d),
      explanation:`${esc(a)} relates to ${esc(b)} the same way ${esc(c)} relates to <b>${esc(d)}</b>.`};
  }
  function genLogic(){
    const t = pick(LOGIC_TEMPLATES);
    return {category:"Verbal", prompt:`${t.p.join(" ")} ${t.q}`, choices: t.opts, correctIndex: t.a,
      explanation: t.ex};
  }
  const VERBAL_GENS = [genSynonym, genAntonym, genAnalogy, genLogic];

  /* ============================= SPATIAL GENERATORS (SVG) ============================= */
  const SHAPE_POINTS = {
    triangle: "50,12 88,85 12,85",
    arrow: "50,8 82,48 63,48 63,92 37,92 37,48 18,48",
    chevronL: "20,20 55,20 55,45 80,45 80,80 20,80"
  };
  function svgShape({shape="triangle", rotation=0, filled=true, size=100, stroke="var(--text)"}={}){
    const pts = SHAPE_POINTS[shape];
    const fill = filled ? stroke : "none";
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g transform="rotate(${rotation} 50 50)">
        <polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="5" stroke-linejoin="round"/>
      </g>
    </svg>`;
  }
  function svgDots(n, stroke="var(--text)"){
    const cols = Math.ceil(Math.sqrt(n));
    const cells=[]; let i=0;
    const spacing = 80/Math.max(cols,1);
    for(let r=0; r*cols<n; r++){
      for(let c=0;c<cols && i<n;c++,i++){
        const cx = 15+c*spacing+spacing/2, cy = 15+r*spacing+spacing/2;
        cells.push(`<circle cx="${cx}" cy="${cy}" r="7" fill="${stroke}"/>`);
      }
    }
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${cells.join("")}</svg>`;
  }

  function genRotationSeq(){
    const shape = pick(["triangle","arrow","chevronL"]);
    const step = pick([30,40,45,60,72,90]);
    const startRot = rnd(0,11)*30;
    const frames = [0,1,2].map(i=>svgShape({shape, rotation:startRot+i*step}));
    const correctRot = startRot+3*step;
    const correct = svgShape({shape, rotation: correctRot});
    const distractors = shuffle([step*-1, step*2, Math.round(step/2), step+20]).slice(0,3)
      .map(off=>svgShape({shape, rotation: correctRot+off}));
    const choices = shuffle([correct, ...distractors]);
    return {category:"Spatial", isVisual:true,
      prompt:"The figure rotates by a fixed amount each step. Which option continues the sequence?",
      promptVisual: frames, choices, correctIndex: choices.indexOf(correct),
      explanation:`The shape rotates ${step}° clockwise each step, so the next frame sits at ${correctRot%360}°.`};
  }

  function genCountSeq(){
    const type = pick(["arith","double"]);
    let seq, next, ex;
    if(type==="arith"){
      const start=rnd(1,3), d=rnd(2,3);
      seq=[start,start+d,start+2*d]; next=start+3*d;
      ex = `Each frame adds ${d} more dots.`;
    } else {
      const start=rnd(1,2);
      seq=[start, start*2, start*4]; next = start*8;
      ex = `The dot count doubles each frame.`;
    }
    const frames = seq.map(n=>svgDots(n));
    const correct = svgDots(next);
    const distractors = shuffle([next-2, next+1, next+3].filter(v=>v>0 && v!==next)).slice(0,3)
      .map(v=>svgDots(v));
    while(distractors.length<3) distractors.push(svgDots(next+distractors.length+4));
    const choices = shuffle([correct, ...distractors]);
    return {category:"Spatial", isVisual:true,
      prompt:"How many dots belong in the next frame of the pattern?",
      promptVisual: frames, choices, correctIndex: choices.indexOf(correct),
      explanation:`${ex} Next frame has <b>${next}</b> dots.`};
  }

  function genOddOneOut(){
    const shape = pick(["triangle","arrow","chevronL"]);
    const baseRot = rnd(0,11)*30;
    const filled = pick([true,false]);
    const oddIdx = rnd(0,3);
    const oddRot = baseRot + pick([90,120,150,180]);
    const tiles = [0,1,2,3].map(i => svgShape({shape, rotation: i===oddIdx?oddRot:baseRot, filled}));
    return {category:"Spatial", isVisual:true,
      prompt:"Four shapes share the same orientation, and one is rotated differently. Select the odd one out.",
      promptVisual: [], choices: tiles, correctIndex: oddIdx,
      explanation:`All others are rotated to ${baseRot%360}°; the odd shape sits at ${oddRot%360}°.`};
  }

  function genShapeAnalogy(){
    const shapeA = pick(["triangle","arrow","chevronL"]);
    const shapeC = pick(["triangle","arrow","chevronL"]);
    const transform = pick(["rotate90","rotate180","fillToggle","grow"]);
    function apply(shape, base){
      if(transform==="rotate90") return svgShape({shape, rotation: base.rotation+90, filled: base.filled});
      if(transform==="rotate180") return svgShape({shape, rotation: base.rotation+180, filled: base.filled});
      if(transform==="fillToggle") return svgShape({shape, rotation: base.rotation, filled: !base.filled});
      return svgShape({shape, rotation: base.rotation, filled: base.filled}); // grow uses same, size shown via viewBox scale below
    }
    const baseA = {rotation: pick([0,90,180,270]), filled:true};
    const svgA = svgShape({shape:shapeA, ...baseA});
    const svgB = apply(shapeA, baseA);
    const baseC = {rotation: pick([0,90,180,270]), filled: pick([true,false])};
    const svgC = svgShape({shape:shapeC, ...baseC});
    const svgCorrect = apply(shapeC, baseC);
    const distractors = [];
    distractors.push(svgShape({shape:shapeC, rotation: baseC.rotation, filled: baseC.filled})); // unchanged
    distractors.push(svgShape({shape:shapeC, rotation: baseC.rotation+45, filled: baseC.filled}));
    distractors.push(svgShape({shape:shapeC, rotation: baseC.rotation+ (transform==="rotate90"?180:90), filled: !baseC.filled}));
    const choices = shuffle([svgCorrect, ...distractors]);
    const names = {rotate90:"rotated 90° clockwise", rotate180:"rotated 180°", fillToggle:"filled/unfilled is swapped", grow:"kept the same relative size"};
    return {category:"Spatial", isVisual:true,
      prompt:`Shape A relates to Shape B. Apply the same relationship to Shape C to find Shape D.`,
      promptVisual: [svgA, svgB, svgC], promptLabels:["A","B","C"],
      choices, correctIndex: choices.indexOf(svgCorrect),
      explanation:`A → B is ${names[transform]}. Applying that same change to C gives the correct D.`};
  }

  const SPATIAL_GENS = [genRotationSeq, genCountSeq, genOddOneOut, genShapeAnalogy];

  /* ============================= QUESTION BANK (from DB via API) ============================= */
  let BANK = { Math: [], Verbal: [], Spatial: [] };

  async function loadBank(){
    try {
      const r = await fetch('/api/ccat/questions');
      if(!r.ok) throw new Error('api failed');
      const qs = await r.json();
      for(const q of qs){
        if(q.active !== false && BANK[q.category]) BANK[q.category].push(q);
      }
    } catch(e){
      // fallback to static JSON if API unavailable
      try {
        const r2 = await fetch('/ccat/questions.json');
        if(!r2.ok) return;
        const qs = await r2.json();
        for(const q of qs){ if(BANK[q.category]) BANK[q.category].push(q); }
      } catch(e2){ /* generators handle it */ }
    }
  }

  /* ============================= QUESTION FACTORY ============================= */
  function generateOne(category){
    // 50% chance to use a bank question if available for this category
    if(BANK[category] && BANK[category].length && Math.random() < 0.5){
      return pick(BANK[category]);
    }
    if(category==="Math") return pick(MATH_GENS)();
    if(category==="Verbal") return pick(VERBAL_GENS)();
    if(category==="Spatial") return pick(SPATIAL_GENS)();
    return pick([...MATH_GENS, ...VERBAL_GENS, ...SPATIAL_GENS])();
  }
  function generateSet(category, n, filteredCats){
    const pool = filteredCats && filteredCats.length ? filteredCats : (category==="Mixed" ? ["Math","Verbal","Spatial"] : null);
    const out=[];
    for(let i=0;i<n;i++){
      if(pool) out.push(generateOne(pick(pool)));
      else out.push(generateOne(category));
    }
    return out;
  }

  /* ============================= HISTORY (localStorage) ============================= */
  const HIST_KEY = "ccat_practice_history_v1";
  function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY))||[]; }catch(e){ return []; } }
  function saveAttempt(rec){
    const h = loadHistory(); h.unshift(rec);
    localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0,30)));
  }

  /* ============================= APP STATE ============================= */
  const app = document.getElementById("app");
  let state = {};

  function resetTestState({mode, category, count, seconds, instantFeedback, filteredCats}){
    state = {
      mode, category, instantFeedback,
      questions: generateSet(category, count, filteredCats),
      idx: 0,
      answers: [], // {chosen, correct, timeSpent}
      totalSeconds: seconds,
      remaining: seconds,
      qStart: Date.now(),
      timerId: null,
      answeredCurrent: false,
    };
  }

  /* ============================= HASH ROUTING ============================= */
  function nav(screen){ history.pushState({screen}, '', '#' + screen); }

  function updateBackBtn(){
    const btn = document.getElementById('lbt-back-btn');
    if(!btn) return;
    const onTest = location.hash === '#test';
    btn.textContent = onTest ? '← Exit Test' : '← Back to Toolkit';
    btn.onclick = onTest ? (e) => {
      e.preventDefault();
      if(confirm('Exit this session? Progress on this attempt won\'t be saved.')) {
        stopTimer();
        history.pushState({screen:'home'}, '', '#home');
        renderHome();
      }
    } : null;
    btn.href = onTest ? '#' : '/tools';
  }

  window.addEventListener('popstate', e => {
    const screen = e.state?.screen ?? 'home';
    stopTimer();
    if(screen === 'home') renderHome(true);
    else if(screen === 'history') renderHistory(true);
    else renderHome(true);
    updateBackBtn();
  });

  /* ---------- HOME ---------- */

  /* ---------- TIMER ---------- */
  function stopTimer(){ if(state.timerId){ clearInterval(state.timerId); state.timerId=null; } }
  function startTimer(){
    if(state.mode!=="timed") return;
    stopTimer();
    state.timerId = setInterval(()=>{
      state.remaining -= 1;
      updateTimerUI();
      if(state.remaining<=0){ stopTimer(); finishTest(); }
    }, 1000);
  }
  function updateTimerUI(){
    const el = app.querySelector("#timer");
    if(!el) return;
    el.textContent = fmtTime(state.remaining);
    el.classList.toggle("warn", state.remaining<=120 && state.remaining>30);
    el.classList.toggle("critical", state.remaining<=30);
  }

  /* ---------- RUNNER ---------- */
  function renderRunner(){
    nav('test'); updateBackBtn();
    const q = state.questions[state.idx];
    const total = state.questions.length;
    const pct = Math.round((state.idx/total)*100);
    const catClass = "cat-"+q.category;

    let visualBlock = "";
    if(q.promptVisual && q.promptVisual.length){
      visualBlock = `<div class="qvisual">${q.promptVisual.map((svg,i)=>`
        <div style="text-align:center">${svg}${q.promptLabels?`<div class="eyebrow" style="margin-top:0.3rem">${q.promptLabels[i]}</div>`:''}</div>
      `).join("")}</div>`;
    } else if(q.promptSvg){
      visualBlock = `<div class="qvisual" style="overflow-x:auto">${q.promptSvg}</div>`;
    }

    const optsHtml = q.choices.map((choice, i)=>{
      const letter = String.fromCharCode(65+i);
      const inner = q.isVisual ? choice : `<span class="otext">${esc(choice)}</span>`;
      return `<button class="option" data-idx="${i}"><span class="bubble">${letter}</span>${inner}</button>`;
    }).join("");

    const navBoxes = Array.from({length: total}, (_,i) => {
      const answered = state.answers[i] !== undefined;
      const current  = i === state.idx;
      return `<button class="qbox${current?' current':''}${answered?' answered':''}" data-qi="${i}">${i+1}</button>`;
    }).join('');

    app.innerHTML = `
      <div class="topbar">
        <div class="topbar-inner">
          ${state.mode==="timed" ? `<div id="timer" class="timer mono">${fmtTime(state.remaining)}</div>` : `<div class="qcount mono">PRACTICE</div>`}
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="qcount">Q <span class="mono">${String(state.idx+1).padStart(2,"0")}</span>/<span class="mono">${total}</span></div>
        </div>
      </div>
      <div class="screen" style="padding-top:0">
        <div class="qcard">
          <div class="qcat-label ${catClass}"><span class="cat-dot"></span>${q.category}</div>
          <div class="qprompt">${esc(q.prompt)}</div>
          ${visualBlock}
          <div class="options ${q.isVisual?'visual':''}" id="opts">${optsHtml}</div>
          <div class="explain" id="explain"></div>
          <div class="qfooter">
            <button class="btn btn-ghost" data-action="quit">Exit to home</button>
            <button class="btn btn-primary" id="next-btn" ${state.instantFeedback ? 'disabled' : ''}>${state.idx===total-1 ? "Finish" : "Next"} →</button>
          </div>
        </div>
        <div class="qnav">
          <div class="qnav-label">
            <span>Question Navigator</span>
            <div class="qnav-legend">
              <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);"></span> Current</span>
              <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--bg-sunken);border:1.5px solid var(--rule-strong);"></span> Answered</span>
              <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;border:1.5px solid var(--rule-strong);"></span> Skipped</span>
            </div>
          </div>
          <div class="qnav-grid" id="qnav-grid">${navBoxes}</div>
        </div>
      </div>
    `;
    state.answeredCurrent = false;
    state.qStart = Date.now();
    updateTimerUI();
    if(state.mode==="timed" && !state.timerId) startTimer();

    app.querySelector("#opts").addEventListener("click", e=>{
      const btn = e.target.closest(".option"); if(!btn || state.answeredCurrent && state.instantFeedback) return;
      const i = +btn.dataset.idx;
      app.querySelectorAll("#opts .option").forEach(o=>o.classList.remove("selected"));
      btn.classList.add("selected");
      state.pendingChoice = i;
      if(state.instantFeedback){
        lockAnswer(i);
      } else {
        app.querySelector("#next-btn").disabled = false;
      }
    });
    app.querySelector("#next-btn").onclick = ()=> advance();
    app.querySelector('[data-action="quit"]').onclick = ()=>{
      if(confirm("Exit this session? Your progress on this attempt won't be saved.")) renderHome();
    };
    app.querySelector("#qnav-grid").addEventListener("click", e => {
      const btn = e.target.closest(".qbox");
      if(!btn) return;
      const target = +btn.dataset.qi;
      if(target === state.idx) return;
      // save any pending selection for current question
      const q = state.questions[state.idx];
      const chosen = state.pendingChoice;
      if(chosen !== undefined) {
        state.answers[state.idx] = {
          chosen, correct: chosen === q.correctIndex,
          category: q.category, timeSpent: (Date.now()-state.qStart)/1000
        };
      }
      state.pendingChoice = undefined;
      state.idx = target;
      renderRunner();
    });
  }

  function lockAnswer(i){
    const q = state.questions[state.idx];
    state.answeredCurrent = true;
    const opts = app.querySelectorAll("#opts .option");
    opts.forEach((o,idx)=>{
      o.classList.add("disabled");
      if(idx===q.correctIndex) o.classList.add("correct");
      else if(idx===i) o.classList.add("incorrect");
    });
    const exEl = app.querySelector("#explain");
    exEl.innerHTML = `<b>${i===q.correctIndex ? "Correct." : "Not quite."}</b> ${q.explanation}`;
    exEl.classList.add("show");
    app.querySelector("#next-btn").disabled = false;
  }

  function advance(){
    const q = state.questions[state.idx];
    const chosen = state.pendingChoice;
    const timeSpent = (Date.now()-state.qStart)/1000;
    state.answers[state.idx] = {
      chosen: chosen===undefined ? -1 : chosen,
      correct: chosen===q.correctIndex,
      category: q.category,
      timeSpent
    };
    state.pendingChoice = undefined;
    if(state.idx < state.questions.length-1){
      state.idx += 1;
      renderRunner();
    } else {
      finishTest();
    }
  }

  function finishTest(){
    stopTimer();
    // fill any unanswered
    for(let i=0;i<state.questions.length;i++){
      if(!state.answers[i]) state.answers[i] = {chosen:-1, correct:false, category: state.questions[i].category, timeSpent:0};
    }
    const total = state.questions.length;
    const score = state.answers.filter(a=>a.correct).length;
    const byCat = {};
    state.questions.forEach((q,i)=>{
      byCat[q.category] = byCat[q.category] || {correct:0,total:0};
      byCat[q.category].total += 1;
      if(state.answers[i].correct) byCat[q.category].correct += 1;
    });
    const avgTime = state.answers.reduce((s,a)=>s+a.timeSpent,0)/total;
    const rec = {
      date: Date.now(), mode: state.mode, category: state.category,
      score, total, accuracy: Math.round(score/total*100), avgTime: Math.round(avgTime*10)/10, byCat
    };
    saveAttempt(rec);
    renderResults(rec);
  }

  /* ---------- RESULTS ---------- */
  function renderResults(rec){
    nav('results'); updateBackBtn();
    const catColors = {Math:"#3556D9", Verbal:"#2E8B57", Spatial:"#C98A2C"};
    const missed = state.questions.map((q,i)=>({q, a:state.answers[i], i}))
      .filter(x=>!x.a.correct);

    const catHtml = Object.entries(rec.byCat).map(([cat,v])=>{
      const pct = Math.round(v.correct/v.total*100);
      return `<div class="cat-card">
        <div class="top"><span>${cat}</span><span class="mono">${v.correct}/${v.total}</span></div>
        <div class="cat-bar"><div style="width:${pct}%; background:${catColors[cat]||'var(--accent)'}"></div></div>
      </div>`;
    }).join("");

    const reviewHtml = missed.length ? missed.map(({q,a})=>`
      <div class="review-item">
        <div class="rq">${q.isVisual ? `[${q.category} — visual question]` : esc(q.prompt)}</div>
        <div class="ra">
          <span class="wrong">Your answer: ${a.chosen===-1 ? "skipped" : (q.isVisual? "Option "+String.fromCharCode(65+a.chosen) : esc(q.choices[a.chosen]))}</span>
          <span class="right">Correct: ${q.isVisual ? "Option "+String.fromCharCode(65+q.correctIndex) : esc(q.choices[q.correctIndex])}</span>
        </div>
        <div class="rex">${q.explanation}</div>
      </div>
    `).join("") : `<div class="empty">No missed questions — clean sweep.</div>`;

    app.innerHTML = `
      <div class="screen">
        <div class="topnav"><div class="eyebrow">${rec.mode==="timed"?"Timed Result":"Practice Result"}</div></div>
        <div class="score-hero">
          <div>
            <div class="score-big mono">${rec.score}<span style="font-size:1.4rem;color:var(--text-faint)">/${rec.total}</span></div>
            <div class="score-sub">${rec.accuracy}% accuracy</div>
          </div>
          <div class="stat-strip">
            <div class="stat"><span class="n mono">${rec.avgTime}s</span><span class="l">Avg / Question</span></div>
            <div class="stat"><span class="n mono">${rec.mode==="timed" ? fmtTime(state.totalSeconds) : "—"}</span><span class="l">Time Budget</span></div>
            <div class="stat"><span class="n mono">18s</span><span class="l">CCAT Target Pace</span></div>
          </div>
        </div>
        <div class="cat-breakdown">${catHtml}</div>
        <h2 style="margin-top:2.25rem; font-size:1.2rem;">Review</h2>
        <div class="review-list">${reviewHtml}</div>
        <div style="display:flex; gap:0.75rem; margin-top:2.25rem; flex-wrap:wrap;">
          <button class="btn btn-primary" data-action="home">Back to Home</button>
          <button class="btn" data-action="history">View History</button>
        </div>
      </div>
    `;
    app.querySelector('[data-action="home"]').onclick = renderHome;
    app.querySelector('[data-action="history"]').onclick = renderHistory;
  }

  /* ---------- HISTORY ---------- */
  function renderHistory(fromPop){
    stopTimer();
    if(!fromPop) nav('history'); updateBackBtn();
    const hist = loadHistory();
    let chart = "";
    if(hist.length>1){
      const pts = hist.slice(0,15).reverse().map(h=>h.accuracy);
      const w=560,h=120,pad=10;
      const stepX = (w-pad*2)/(pts.length-1);
      const coords = pts.map((v,i)=>{
        const x = pad+i*stepX;
        const y = h-pad-(v/100)*(h-pad*2);
        return [x,y];
      });
      const path = coords.map((c,i)=>(i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
      const gridLines = [0,25,50,75,100].map(v=>{
        const y = h-pad-(v/100)*(h-pad*2);
        return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="var(--rule)" stroke-width="1"/>`;
      }).join("");
      const last = coords[coords.length-1];
      chart = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">
        ${gridLines}
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)"/>
      </svg>`;
    }
    const rows = hist.map(h=>`
      <tr>
        <td>${new Date(h.date).toLocaleDateString()} <span style="color:var(--text-faint)">${new Date(h.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></td>
        <td>${h.mode==="timed" ? "Timed" : "Practice"} · ${h.category}</td>
        <td class="mono">${h.score}/${h.total}</td>
        <td class="mono">${h.accuracy}%</td>
        <td class="mono">${h.avgTime}s</td>
      </tr>
    `).join("");
    app.innerHTML = `
      <div class="screen">
        <div class="topnav">
          <h2>History</h2>
          <button class="btn btn-ghost back" data-action="home">← Home</button>
        </div>
        ${hist.length>1 ? `<div class="hist-chart"><div class="eyebrow" style="margin-bottom:0.6rem">Accuracy trend (most recent ${Math.min(hist.length,15)})</div>${chart}</div>` : ""}
        <div class="table-wrap">
          ${hist.length ? `<table>
            <thead><tr><th>Date</th><th>Mode</th><th>Score</th><th>Accuracy</th><th>Avg Pace</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>` : `<div class="empty">No attempts yet. Run a Full Timed Test or a Practice Drill from the home screen.</div>`}
        </div>
      </div>
    `;
    app.querySelector('[data-action="home"]').onclick = renderHome;
  }

  /* ---------- KEYBOARD SHORTCUTS ---------- */
  document.addEventListener("keydown", e=>{
    const opts = app.querySelectorAll("#opts .option");
    if(!opts.length) return;
    if(e.key==="Enter"){
      e.preventDefault();
      const nb = app.querySelector("#next-btn");
      if(nb && !nb.disabled) nb.click();
      return;
    }
    const key = e.key.toUpperCase();
    const map = {"1":0,"2":1,"3":2,"4":3,"A":0,"B":1,"C":2,"D":3};
    if(map[key]!==undefined && opts[map[key]]){ opts[map[key]].click(); }
  });

  loadBank().then(() => { renderHome(); updateBackBtn(); });
})();
</script>
